<!doctype html>

<head>

<style>
:root{--ink:#18364e;--muted:#52646b;--paper:#f6f8f7;--green:#245e46;--green-dark:#16432f;--line:#d9e1df}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Cairo',Tahoma,Arial,sans-serif;font-size:17px;line-height:1.9;color:var(--ink);background:var(--paper);-webkit-text-size-adjust:100%}

h1{font-size:24px;margin:8px 0 12px;line-height:1.5}
p{margin:0 0 24px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:12px}
a.btn{display:block;padding:14px 20px;border-radius:12px;font-weight:700;text-decoration:none;min-height:48px}
a.primary{background:var(--green);color:#fff}
a.primary:hover{background:var(--green-dark)}
a.secondary{border:2px solid var(--ink);color:var(--ink)}
a.secondary:hover{background:#eaf2ed}
:focus-visible{outline:3px solid #a45b0b;outline-offset:4px}
</style>
</head>
<body>
<main>
  <img class="logo" src="/warshabeteya/logo.webp" alt="شعار ورشة بيتية" width="84" height="84">

  <div class="actions">

    <a class="btn secondary" href="https://wa.me/201277048080" rel="noopener noreferrer">كلمنا على واتساب</a>
  </div>
</main>
</body>
</html>
